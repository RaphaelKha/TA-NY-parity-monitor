fx: ILS=X                      # USD/ILS, shekels per dollar
thresholds_bps: [20, 40, 60]   # round-trip costs tested
min_run_min: 3                 # an episode must last this long to leave time to execute both legs
bias_window_min: 300           # trailing window (common minutes) for the usual bias

# ratio = TASE shares per US share. All 1, confirmed by the data: median gaps of -2 to -13 bp,
# where a ratio of 2 or 1/2 would give about -5,000 or +10,000 bp.
pairs:                         # US ticker -> TASE ticker
  TEVA: {tase: TEVA.TA, ratio: 1}
  NICE: {tase: NICE.TA, ratio: 1}
  ESLT: {tase: ESLT.TA, ratio: 1}
  ICL:  {tase: ICL.TA,  ratio: 1}
